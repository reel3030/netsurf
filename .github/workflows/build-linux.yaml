name: Build NetSurf for Linux (GTK3)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git bison flex pkg-config \
          libgtk-3-dev libcurl4-openssl-dev libssl-dev \
          libpng-dev libjpeg-dev libwebp-dev libexpat1-dev \
          gperf libhtmlcxx-dev libutf8proc-dev

    - name: Clone NetSurf Source from GitHub Mirror
      run: |
        GH_HOST="https://github.com"
        git clone "${GH_HOST}/netsurf-browser/netsurf.git"
        
    - name: Fetch Required Sub-Libraries
      run: |
        GH_HOST="https://github.com"
        git clone "${GH_HOST}/netsurf-browser/buildsystem.git"
        git clone "${GH_HOST}/netsurf-browser/nsgenbind.git"     # ← ツールを追加
        git clone "${GH_HOST}/netsurf-browser/libwapcaplet.git"
        git clone "${GH_HOST}/netsurf-browser/libparserutils.git"
        git clone "${GH_HOST}/netsurf-browser/libhubbub.git"
        git clone "${GH_HOST}/netsurf-browser/libcss.git"
        git clone "${GH_HOST}/netsurf-browser/libnsutils.git"
        git clone "${GH_HOST}/netsurf-browser/libdom.git"
        git clone "${GH_HOST}/netsurf-browser/libnsgif.git"
        git clone "${GH_HOST}/netsurf-browser/libnsbmp.git"
        git clone "${GH_HOST}/netsurf-browser/libnsfb.git"
        git clone "${GH_HOST}/netsurf-browser/libnspsl.git"

    - name: Build Libraries and NetSurf Browser
      run: |
        export TARGET_WORKSPACE=$(pwd)
        
        # 1. ビルドシステムのセットアップ
        make -C buildsystem install PREFIX=$TARGET_WORKSPACE/usr
        
        # 2. パスを通して自作ライブラリとツールを順番にビルド
        export PKG_CONFIG_PATH=$TARGET_WORKSPACE/usr/lib/pkgconfig:$PKG_CONFIG_PATH
        export PATH=$TARGET_WORKSPACE/usr/bin:$PATH
        
        # ループの最初に nsgenbind を配置しました（これで $TARGET_WORKSPACE/usr/bin/nsgenbind が生成されます）
        for lib in nsgenbind libwapcaplet libparserutils libhubbub libcss libnsutils libdom libnsgif libnsbmp libnsfb libnspsl; do
          make -C $lib install PREFIX=$TARGET_WORKSPACE/usr Component=$lib
        done
        
        # 3. ブラウザ本体のコンパイル（Linux向けのGTK3を指定）
        cd netsurf
        NETSURF_TARGET=gtk3 make PREFIX=$TARGET_WORKSPACE/usr

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: netsurf-linux-binary
        path: netsurf/nsgtk3
